# Render Blueprint — deploys the Python (canonical) backend.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: khidmat-python-api
    runtime: docker
    plan: free
    region: singapore          # closest free region to Pakistan
    dockerfilePath: ./Dockerfile.python
    dockerContext: .           # Dockerfile copies both data/ and python-agents/
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Set the value in the Render dashboard (Environment tab) — never commit the key.
      - key: GEMINI_API_KEY
        sync: false
